<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Easy Change Canada</title>
<style>
:root{--b:#1677ff;--g:#19a66a;--bg:#f2f6fa;--ink:#172033;--mut:#657085}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
main{max-width:500px;margin:auto;padding:18px 14px 30px}.head{text-align:center}.title{font-size:30px;font-weight:900}.sub{color:var(--mut);margin-top:3px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0}.tab{min-height:54px;border:0;border-radius:17px;background:#e2e9f1;font-size:18px;font-weight:900;color:#405069}.tab.active{background:var(--b);color:white}
.card{background:white;border-radius:25px;padding:18px;box-shadow:0 4px 18px #24364a18}.prompt{text-align:center;font-size:18px;font-weight:800}.amount{text-align:center;font-size:48px;font-weight:950;margin:8px 0 12px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.key{min-height:66px;border:0;border-radius:17px;background:#edf2f7;font-size:21px;font-weight:900}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.btn{min-height:54px;border:0;border-radius:16px;font-size:18px;font-weight:900}.primary{background:var(--g);color:white}.secondary{background:#e8edf3}
.answer{margin-top:17px;background:#f4f8fb;border-radius:20px;padding:15px}.answer h2{text-align:center;font-size:24px;margin:0 0 10px}.money{display:flex;align-items:center;gap:10px;background:white;border:1px solid #dde5ee;border-radius:15px;padding:9px;margin:7px 0}.bill{width:100px;height:56px;border-radius:8px;background:linear-gradient(135deg,#e8f3e7,#c9dfca);border:2px solid #609562;display:flex;align-items:center;justify-content:center;font-weight:950;font-size:19px;flex:none}.coin{width:58px;height:58px;border-radius:50%;background:linear-gradient(145deg,#f5f5f5,#c5c5c5);border:3px solid #999;display:flex;align-items:center;justify-content:center;font-weight:950;font-size:15px;flex:none}.mlabel{font-size:20px;font-weight:900}.hidden{display:none}.counts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cb{min-height:100px;border:2px solid #dce4ec;border-radius:20px;background:white;font-weight:950;font-size:34px;color:var(--ink);position:relative}.cb .mini{display:block;font-size:18px;color:var(--mut);margin-top:3px;font-weight:800}.cb .qty{position:absolute;right:9px;top:8px;min-width:30px;height:30px;padding:3px 7px;border-radius:15px;background:var(--b);color:white;font-size:16px;line-height:24px}.total{background:#172033;color:#fff;border-radius:19px;text-align:center;padding:13px;font-size:33px;font-weight:950;margin:12px 0}.hint{text-align:center;color:var(--mut);font-size:14px;line-height:1.35;margin-top:10px}
</style></head><body><main>
<div class="head"><div class="title">Easy Change Canada</div><div class="sub">A simple money helper for the cash register</div></div>
<div class="tabs"><button class="tab active" id="t1">Give Change</button><button class="tab" id="t2">Count Money</button></div>
<section id="give" class="card"><div class="prompt">What change does the register say?</div><div class="amount" id="ga">$0.00</div><div class="pad" id="pad"></div><div class="actions"><button class="btn primary" id="show">Show Change</button><button class="btn secondary" id="gc">Clear</button></div><div id="ans"></div></section>
<section id="count" class="card hidden"><div class="prompt">Tap each bill or coin the customer gives you</div><div class="total" id="ct">$0.00</div><div class="counts" id="counts"></div><div class="actions"><button class="btn primary" id="speak">Speak Total</button><button class="btn secondary" id="cc">Clear</button></div><div class="hint">Tap once for each bill or coin.</div></section>
</main>
<script>
(()=>{const $=id=>document.getElementById(id),D=[["$100 bill",10000,"bill"],["$50 bill",5000,"bill"],["$20 bill",2000,"bill"],["$10 bill",1000,"bill"],["$5 bill",500,"bill"],["$2 coin",200,"coin"],["$1 coin",100,"coin"],["25¢ coin",25,"coin"],["10¢ coin",10,"coin"],["5¢ coin",5,"coin"]];let g=0,c=0;
const fmt=n=>(n/100).toLocaleString("en-CA",{style:"currency",currency:"CAD"});
["1","2","3","4","5","6","7","8","9","0","00","⌫"].forEach(x=>{let b=document.createElement("button");b.className="key";b.textContent=x;b.onclick=()=>{if(x==="⌫")g=Math.floor(g/10);else{let s=String(g)+x;if(s.length<=7)g=Math.min(100000,parseInt(s,10)||0)}$("ga").textContent=fmt(g);$("ans").innerHTML=""};$("pad").appendChild(b)});
function icon(d){return `<div class="${d[2]}">${d[0].replace(" bill","").replace(" coin","")}</div>`}
function answer(){if(!g){$("ans").innerHTML='<div class="hint">Enter the change amount first.</div>';return}let left=g,a=[];D.forEach(d=>{while(left>=d[1]){a.push(d);left-=d[1]}});$("ans").innerHTML=`<div class="answer"><h2>Give the customer:</h2>${a.map(d=>`<div class="money">${icon(d)}<div class="mlabel">${d[0]}</div></div>`).join("")}<div class="hint">Pick up the money in the order shown.</div><button class="btn primary" style="width:100%;margin-top:10px" id="sp">🔊 Speak</button></div>`;$("sp").onclick=()=>speechSynthesis.speak(new SpeechSynthesisUtterance("Give the customer "+a.map(d=>d[0]).join(", ")))}
$("show").onclick=answer;$("gc").onclick=()=>{g=0;$("ga").textContent="$0.00";$("ans").innerHTML=""};
D.forEach(d=>{let b=document.createElement("button");b.className="cb";b.innerHTML=`<span>${d[0].replace(" bill","").replace(" coin","")}</span><span class="mini">tap</span>`;let q=0;b.onclick=()=>{q++;c=Math.min(100000,c+d[1]);$("ct").textContent=fmt(c);b.innerHTML=`<span class="qty">×${q}</span><span>${d[0].replace(" bill","").replace(" coin","")}</span><span class="mini">tap</span>`;b.style.borderColor="var(--b)";setTimeout(()=>b.style.borderColor="",200)};$("counts").appendChild(b)});
$("cc").onclick=()=>{c=0;$("ct").textContent="$0.00";document.querySelectorAll(".cb").forEach((b,i)=>{b.innerHTML=`<span>${D[i][0].replace(" bill","").replace(" coin","")}</span><span class="mini">tap</span>`;b.style.borderColor=""})};$("speak").onclick=()=>speechSynthesis.speak(new SpeechSynthesisUtterance("The total is "+fmt(c)));
$("t1").onclick=()=>{$("t1").classList.add("active");$("t2").classList.remove("active");$("give").classList.remove("hidden");$("count").classList.add("hidden")};
$("t2").onclick=()=>{$("t2").classList.add("active");$("t1").classList.remove("active");$("count").classList.remove("hidden");$("give").classList.add("hidden")};
})()
</script></body></html>
